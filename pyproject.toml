[project]
name = "libmem-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Cook", email = "awcook97@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "libmem>=5.1.4",
    "mcp[cli]>=1.27.1",
    "mss>=9.0",
    "pillow>=11.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
gameinput-x11 = ["python-xlib>=0.33"]
gameinput-win32 = ["pywin32>=306"]

[project.scripts]
libmem-mcp = "libmem_mcp:main"
gameinput-mcp = "gameinput_mcp:main"
gameinput-daemon = "gameinput_mcp.daemon:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
