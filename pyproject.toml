[project]
name = "libmem-mcp"
version = "0.2.0"
description = "MCP server exposing libmem for process and memory inspection — read-only by default, with memory writes, hooks, and allocation gated behind an opt-in flag."
readme = "README.md"
authors = [
    { name = "Andrew Cook", email = "awcook97@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "libmem>=5.1.4",
    "mcp[cli]>=1.27.1",
]

[project.scripts]
libmem-mcp = "libmem_mcp:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
